<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>成都楼市周报 · 登录</title>
  <style>
    :root { --bg:#f4f6f9; --card:#fff; --primary:#1a3a5c; --accent:#c41230; --text:#333; --muted:#999; --border:#e5e5e5; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #1a3a5c 0%, #2c5f8a 50%, #1a3a5c 100%);
      min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
    }
    .login-card {
      background:var(--card); border-radius:12px; box-shadow:0 8px 40px rgba(0,0,0,0.25);
      padding:48px 40px 36px; width:100%; max-width:400px; text-align:center;
    }
    .login-card .logo { font-size:32px; margin-bottom:8px; }
    .login-card h1 { font-size:20px; color:var(--primary); font-weight:700; margin-bottom:4px; letter-spacing:1px; }
    .login-card .sub { font-size:13px; color:var(--muted); margin-bottom:28px; }
    .login-card label { display:block; text-align:left; font-size:13px; color:#555; margin-bottom:6px; font-weight:500; }
    .login-card input {
      width:100%; padding:12px 16px; border:2px solid var(--border); border-radius:8px; font-size:15px;
      outline:none; transition:border-color 0.2s; margin-bottom:8px;
    }
    .login-card input:focus { border-color:var(--primary); }
    .login-card .err { color:var(--accent); font-size:12px; min-height:20px; text-align:left; margin-bottom:16px; }
    .login-card .err.shake { animation: shake 0.4s ease; }
    @keyframes shake {
      0%,100% { transform:translateX(0); }
      20% { transform:translateX(-8px); }
      40% { transform:translateX(8px); }
      60% { transform:translateX(-6px); }
      80% { transform:translateX(6px); }
    }
    .login-card button {
      width:100%; padding:12px; background:var(--primary); color:#fff; border:none; border-radius:8px;
      font-size:15px; font-weight:600; cursor:pointer; letter-spacing:1px; transition:background 0.2s;
    }
    .login-card button:hover { background:#2c5f8a; }
    .login-card button:disabled { opacity:0.6; cursor:not-allowed; }
    .login-card .hint { font-size:11px; color:var(--muted); margin-top:20px; line-height:1.6; }
  </style>
</head>
<body>
<div class="login-card">
  <div class="logo">🏠</div>
  <h1>成都楼市周报</h1>
  <p class="sub">Chengdu Real Estate Weekly</p>
  <label for="pwd">请输入访问密码</label>
  <input type="password" id="pwd" placeholder="输入密码后按回车" autofocus>
  <div class="err" id="err"></div>
  <button id="btn" onclick="doLogin()">登 录</button>
  <p class="hint">本报告仅限授权用户查看<br>如需访问权限请联系管理员</p>
</div>

<script>
// ===== 配置：修改密码请更新此处的 SHA-256 哈希值 =====
var PASSWORD_HASH = 'cee68940fcbf85ddfd87f3b97332dc6b74c384f0a7a8c696da6dfe64dc2fa054';

var btn = document.getElementById('btn');
var inp = document.getElementById('pwd');
var err = document.getElementById('err');

inp.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});

async function sha256(str) {
  var buf = new TextEncoder().encode(str);
  var hash = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hash)).map(function(b) { return b.toString(16).padStart(2, '0'); }).join('');
}

function showErr(msg) {
  err.textContent = msg;
  err.classList.remove('shake');
  void err.offsetWidth;
  err.classList.add('shake');
  inp.focus();
  inp.select();
}

async function doLogin() {
  var pwd = inp.value.trim();
  if (!pwd) { showErr('请输入密码'); return; }

  btn.disabled = true;
  btn.textContent = '验证中...';

  var h;
  try {
    h = await sha256(pwd);
  } catch(e) {
    // Fallback for older browsers
    showErr('浏览器不支持安全验证，请使用 Chrome/Edge/Safari 最新版');
    btn.disabled = false;
    btn.textContent = '登 录';
    return;
  }

  if (h === PASSWORD_HASH) {
    sessionStorage.setItem('cdre_auth', '1');
    window.location.href = 'index.html';
  } else {
    showErr('密码错误，请重试');
    btn.disabled = false;
    btn.textContent = '登 录';
  }
}
</script>
</body>
</html>
